<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Minerador de Ofertas</title>
<style>
  :root { --bg:#0f1720; --card:#18232f; --linha:#26374a; --txt:#e8eef5;
          --suave:#93a4b8; --verde:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--txt);
         font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  form { background:var(--card); border:1px solid var(--linha); border-radius:14px;
         padding:32px; width:min(380px, 92vw); }
  h1 { margin:0 0 4px; font-size:20px; }
  p.sub { margin:0 0 22px; color:var(--suave); font-size:13px; }
  label { display:block; font-size:12px; color:var(--suave); margin:14px 0 6px;
          text-transform:uppercase; letter-spacing:.04em; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--linha);
          background:#0d151d; color:var(--txt); font-size:14px; }
  input:focus { outline:2px solid var(--verde); outline-offset:1px; }
  button { width:100%; margin-top:22px; padding:12px; border:0; border-radius:9px;
           background:var(--verde); color:#04120a; font-weight:700; font-size:14px;
           cursor:pointer; }
  .erro { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:13px;
          background:#3b1620; border:1px solid #7f2036; color:#ffc9d4; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Minerador de Ofertas</h1>
  <p class="sub">Biblioteca de Anúncios · low ticket</p>
  <label for="username">Usuário</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
</form>
</body>
</html>
